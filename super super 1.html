<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Smart Advisor</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #131921;
            --secondary: #FEBD69;
            --accent: #B12704;
            --text: #333;
            --light-bg: #f5f5f5;
            --gray: #ddd;
            --dark-gray: #565959;
            --rating: #FFA41C;
            --white: #fff;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --radius: 8px;
            --transition: all 0.3s ease;
            --price-increase: #388e3c;
            --price-decrease: #d32f2f;
            --card-hover: #f0f2f2;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header Styles */
        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 20px 0;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 2.2rem;
            font-weight: 600;
        }

        /* Search Bar */
        .search-container {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #search-input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            font-size: 16px;
            outline: none;
            background: rgba(255,255,255,0.9);
        }

        #search-btn {
            padding: 0 25px;
            background-color: var(--secondary);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
            color: var(--primary);
            font-size: 16px;
        }

        #search-btn:hover {
            background-color: #e6a756;
        }

        /* Main Layout */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 30px auto;
            gap: 25px;
            padding: 0 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--white);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray);
            font-size: 1.4rem;
            color: var(--primary);
        }

        .categories {
            list-style: none;
        }

        .categories li {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: var(--radius);
            margin-bottom: 8px;
            transition: var(--transition);
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .categories li:hover {
            background-color: var(--card-hover);
        }

        .categories li.active {
            background-color: #e1e3e3;
            font-weight: 600;
            color: var(--primary);
        }

        .category-count {
            font-size: 0.85rem;
            color: var(--dark-gray);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
        }

        /* Sort Options */
        .sort-options {
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-end;
        }

        #sort-by {
            padding: 12px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--gray);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            background-color: var(--white);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        #sort-by:hover {
            border-color: var(--primary);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: rgba(0,0,0,0.1);
        }

        .product-img-container {
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 240px;
            border-bottom: 1px solid var(--gray);
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            transition: var(--transition);
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1rem;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 44px;
            line-height: 1.4;
            color: var(--primary);
        }

        .price-container {
            margin-bottom: 15px;
        }

        .current-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .price-change {
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            margin-left: 8px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .price-up {
            background-color: rgba(56, 142, 60, 0.1);
            color: var(--price-increase);
        }

        .price-down {
            background-color: rgba(211, 47, 47, 0.1);
            color: var(--price-decrease);
        }

        .price-neutral {
            display: none;
        }

        .platform-prices {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px dashed var(--gray);
            font-size: 0.9rem;
        }

        .platform {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .platform-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .platform-price {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .platform-rating {
            color: var(--rating);
            display: flex;
            align-items: center;
            font-size: 0.85rem;
        }

        .platform-rating svg {
            margin-right: 2px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
            gap: 20px;
        }

        .pagination button {
            padding: 10px 25px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            box-shadow: var(--shadow);
        }

        .pagination button:hover:not(:disabled) {
            background-color: #232f3e;
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            background-color: var(--gray);
            cursor: not-allowed;
            opacity: 0.7;
        }

        #page-info {
            font-size: 1rem;
            min-width: 120px;
            text-align: center;
            color: var(--dark-gray);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 100;
            overflow-y: auto;
            padding: 40px 0;
        }

        .modal-content {
            background-color: var(--white);
            margin: 0 auto;
            padding: 40px;
            width: 90%;
            max-width: 900px;
            border-radius: var(--radius);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            color: var(--dark-gray);
            transition: var(--transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-modal:hover {
            color: var(--accent);
            background-color: rgba(0,0,0,0.05);
        }

        /* Modal Product Details */
        .modal-product {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .modal-header {
            display: flex;
            gap: 40px;
        }

        .modal-product-img-container {
            width: 350px;
            height: 350px;
            background: #f9f9f9;
            padding: 30px;
            border-radius: var(--radius);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border: 1px solid var(--gray);
        }

        .modal-product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .modal-product-info {
            flex: 1;
        }

        .modal-product-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: var(--primary);
            line-height: 1.3;
        }

        .modal-price-container {
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 20px 0;
        }

        .modal-current-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
        }

        .modal-price-change {
            display: inline-flex;
            align-items: center;
            font-size: 1rem;
            margin-left: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .modal-price-up {
            background-color: rgba(56, 142, 60, 0.1);
            color: var(--price-increase);
        }

        .modal-price-down {
            background-color: rgba(211, 47, 47, 0.1);
            color: var(--price-decrease);
        }

        .modal-price-neutral {
            display: none;
        }

        .modal-platform-prices {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }

        .modal-platform {
            flex: 1;
            padding: 20px;
            background: #f9f9f9;
            border-radius: var(--radius);
            border: 1px solid var(--gray);
        }

        .modal-platform h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .modal-platform-price {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .modal-platform-rating {
            color: var(--rating);
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 1rem;
        }

        /* Features Sections */
        .features-section {
            margin-top: 30px;
            padding: 25px;
            border-radius: var(--radius);
            border: 1px solid var(--gray);
            background-color: var(--white);
        }

        .features-section h3 {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--gray);
            font-size: 1.3rem;
            color: var(--primary);
        }

        .features-list {
            list-style-position: inside;
            padding-left: 5px;
            columns: 2;
            column-gap: 30px;
        }

        .features-list li {
            margin-bottom: 10px;
            line-height: 1.5;
            break-inside: avoid;
        }

        .advantages-section {
            background: rgba(56, 142, 60, 0.05);
            border-color: rgba(56, 142, 60, 0.2);
        }

        .advantages-section h3 {
            color: var(--price-increase);
        }

        .disadvantages-section {
            background: rgba(211, 47, 47, 0.05);
            border-color: rgba(211, 47, 47, 0.2);
        }

        .disadvantages-section h3 {
            color: var(--price-decrease);
        }

        /* Suggestions Section */
        .suggestions-section {
            margin-top: 40px;
        }

        .suggestions-section h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: var(--primary);
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .suggestion-item {
            border: 1px solid var(--gray);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
            display: flex;
            flex-direction: column;
        }

        .suggestion-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .suggestion-img-container {
            height: 140px;
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--gray);
        }

        .suggestion-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .suggestion-reason {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .suggestion-name {
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 40px;
            line-height: 1.4;
            color: var(--dark-gray);
        }

        .suggestion-price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: auto;
        }

        /* Price Change Indicator */
        .price-indicator {
            display: inline-flex;
            align-items: center;
            margin-left: 8px;
        }

        .price-indicator svg {
            margin-right: 4px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .container {
                max-width: 100%;
                padding: 0 15px;
            }
            
            .modal-header {
                flex-direction: column;
            }
            
            .modal-product-img-container {
                width: 100%;
                margin-bottom: 30px;
            }
            
            .features-list {
                columns: 1;
            }
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                position: static;
                margin-bottom: 30px;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 30px;
            }
            
            .modal-platform-prices {
                flex-direction: column;
                gap: 20px;
            }
            
            .suggestions-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .features-section {
                padding: 20px;
            }
        }

        @media (max-width: 576px) {
            header {
                padding: 15px 0;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .search-container {
                flex-direction: column;
                border-radius: var(--radius);
                overflow: hidden;
            }
            
            #search-input {
                border-radius: var(--radius) var(--radius) 0 0;
                padding: 12px 15px;
            }
            
            #search-btn {
                border-radius: 0 0 var(--radius) var(--radius);
                padding: 12px;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .suggestions-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 20px;
                width: 95%;
            }
            
            .features-section {
                padding: 15px;
            }
            
            .pagination {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

        ];

        // DOM Elements
        const productsContainer = document.getElementById('products-container');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const sortBy = document.getElementById('sort-by');
        const categoryItems = document.querySelectorAll('#categories li');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');
        const productModal = document.getElementById('product-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModal = document.querySelector('.close-modal');

        // App State
        let currentPage = 1;
        const productsPerPage = 8;
        let filteredProducts = [...products];
        let activeCategory = 'all';

        // Initialize the app
        function init() {
            renderProducts();
            setupEventListeners();
        }

        // Render products to the page
        function renderProducts() {
            productsContainer.innerHTML = '';
            
            const startIndex = (currentPage - 1) * productsPerPage;
            const endIndex = startIndex + productsPerPage;
            const productsToShow = filteredProducts.slice(startIndex, endIndex);
            
            if (productsToShow.length === 0) {
                productsContainer.innerHTML = '<p class="no-results">No products found. Try different search criteria.</p>';
                return;
            }
            
            productsToShow.forEach(product => {
                const productCard = createProductCard(product);
                productsContainer.appendChild(productCard);
            });
            
            updatePagination();
        }

        // Create product card HTML
        function createProductCard(product) {
            // Calculate price changes
            const amazonPriceChange = product.amazonPrice - product.price;
            const flipkartPriceChange = product.flipkartPrice - product.price;
            
            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.id = product.id;
            
            card.innerHTML = `
                <div class="product-img-container">
                    <img src="${product.image}" alt="${product.name}" class="product-img">
                </div>
                <div class="product-info">
                    <h3 class="product-title">${product.name}</h3>
                    <div class="price-container">
                        <span class="current-price">₹${product.price.toLocaleString('en-IN')}</span>
                    </div>
                    <div class="platform-prices">
                        <div class="platform">
                            <span class="platform-name">Amazon</span>
                            <span class="platform-price">₹${product.amazonPrice.toLocaleString('en-IN')}</span>
                            ${getPriceChangeIndicator(amazonPriceChange)}
                            <span class="platform-rating">${product.amazonRating} ★</span>
                        </div>
                        <div class="platform">
                            <span class="platform-name">Flipkart</span>
                            <span class="platform-price">₹${product.flipkartPrice.toLocaleString('en-IN')}</span>
                            ${getPriceChangeIndicator(flipkartPriceChange)}
                            <span class="platform-rating">${product.flipkartRating} ★</span>
                        </div>
                    </div>
                </div>
            `;
            
            card.addEventListener('click', () => {
                openProductModal(product.id);
            });
            
            return card;
        }

        // Get price change indicator HTML
        function getPriceChangeIndicator(priceChange) {
            if (priceChange > 0) {
                return `<span class="price-change price-up">+₹${Math.abs(priceChange).toLocaleString('en-IN')}</span>`;
            } else if (priceChange < 0) {
                return `<span class="price-change price-down">-₹${Math.abs(priceChange).toLocaleString('en-IN')}</span>`;
            } else {
                return `<span class="price-change price-neutral">No change</span>`;
            }
        }

        // Open product modal with details
        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            // Calculate price changes
            const amazonPriceChange = product.amazonPrice - product.price;
            const flipkartPriceChange = product.flipkartPrice - product.price;
            
            modalContent.innerHTML = `
                <div class="modal-product">
                    <div class="modal-header">
                        <div class="modal-product-img-container">
                            <img src="${product.image}" alt="${product.name}" class="modal-product-img">
                        </div>
                        <div class="modal-product-info">
                            <h2 class="modal-product-title">${product.name}</h2>
                            <div class="modal-price-container">
                                <span class="modal-current-price">₹${product.price.toLocaleString('en-IN')}</span>
                            </div>
                            <div class="modal-platform-prices">
                                <div class="modal-platform">
                                    <h3>Amazon</h3>
                                    <p class="modal-platform-price">₹${product.amazonPrice.toLocaleString('en-IN')}</p>
                                    ${getModalPriceChangeIndicator(amazonPriceChange)}
                                    <p class="modal-platform-rating">Rating: ${product.amazonRating} ★</p>
                                </div>
                                <div class="modal-platform">
                                    <h3>Flipkart</h3>
                                    <p class="modal-platform-price">₹${product.flipkartPrice.toLocaleString('en-IN')}</p>
                                    ${getModalPriceChangeIndicator(flipkartPriceChange)}
                                    <p class="modal-platform-rating">Rating: ${product.flipkartRating} ★</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="advantages-section features-section">
                        <h3>Top 10 Advantages</h3>
                        <ul class="features-list">
                            ${product.advantages.map(adv => `<li>${adv}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div class="disadvantages-section features-section">
                        <h3>Top 10 Disadvantages</h3>
                        <ul class="features-list">
                            ${product.disadvantages.map(dis => `<li>${dis}</li>`).join('')}
                        </ul>
                    </div>
                    
                    ${product.suggestions && product.suggestions.length > 0 ? `
                    <div class="suggestions-section">
                        <h3>Our Suggestions</h3>
                        <div class="suggestions-grid">
                            ${product.suggestions.map(sug => {
                                const suggestedProduct = products.find(p => p.id === sug.id);
                                if (!suggestedProduct) return '';
                                return `
                                    <div class="suggestion-item" data-id="${sug.id}">
                                        <div class="suggestion-img-container">
                                            <img src="${suggestedProduct.image}" alt="${suggestedProduct.name}" class="suggestion-img">
                                        </div>
                                        <p class="suggestion-reason">${sug.reason}</p>
                                        <p class="suggestion-name">${suggestedProduct.name}</p>
                                        <p class="suggestion-price">₹${suggestedProduct.price.toLocaleString('en-IN')}</p>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            
            document.querySelectorAll('.suggestion-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const suggestionId = parseInt(item.dataset.id);
                    openProductModal(suggestionId);
                });
            });
            
            productModal.style.display = 'block';
        }

        // Get modal price change indicator HTML
        function getModalPriceChangeIndicator(priceChange) {
            if (priceChange > 0) {
                return `<p class="modal-price-change modal-price-up">+₹${Math.abs(priceChange).toLocaleString('en-IN')} higher than average</p>`;
            } else if (priceChange < 0) {
                return `<p class="modal-price-change modal-price-down">-₹${Math.abs(priceChange).toLocaleString('en-IN')} lower than average</p>`;
            } else {
                return `<p class="modal-price-change modal-price-neutral">Same as average price</p>`;
            }
        }

        // Filter products based on search and category
        function filterProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            
            filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm);
                const matchesCategory = activeCategory === 'all' || product.category === activeCategory;
                return matchesSearch && matchesCategory;
            });
            
            sortProducts();
            currentPage = 1;
            renderProducts();
        }

        // Sort products
        function sortProducts() {
            const sortValue = sortBy.value;
            
            switch(sortValue) {
                case 'price-low':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'rating':
                    filteredProducts.sort((a, b) => {
                        const avgRatingA = (a.amazonRating + a.flipkartRating) / 2;
                        const avgRatingB = (b.amazonRating + b.flipkartRating) / 2;
                        return avgRatingB - avgRatingA;
                    });
                    break;
                default:
                    filteredProducts.sort((a, b) => a.id - b.id);
            }
        }

        // Update pagination controls
        function updatePagination() {
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
            
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;
        }

        // Set up event listeners
        function setupEventListeners() {
            // Search functionality
            searchBtn.addEventListener('click', filterProducts);
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') filterProducts();
            });
            
            // Category filtering
            categoryItems.forEach(item => {
                item.addEventListener('click', () => {
                    categoryItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    activeCategory = item.dataset.category;
                    filterProducts();
                });
            });
            
            // Sorting
            sortBy.addEventListener('change', filterProducts);
            
            // Pagination
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderProducts();
                }
            });
            
            nextBtn.addEventListener('click', () => {
                const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderProducts();
                }
            });
            
            // Modal close
            closeModal.addEventListener('click', () => {
                productModal.style.display = 'none';
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === productModal) {
                    productModal.style.display = 'none';
                }
            });
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
